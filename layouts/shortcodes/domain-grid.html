<div class="grid">
{{- range (site.GetPage "/domains").Pages.ByWeight }}

    <p class="eyebrow">{{ .Params.examWeight }}% of the exam</p>
    <strong>{{ with .Params.shortTitle }}{{ . }}{{ else }}{{ .Title }}{{ end }}</strong>
  </a>
{{- end }}
</div>
