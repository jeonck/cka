name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; drop the older one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.164.0

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung browser install should fail in minutes, not burn the default 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Hugo
        # -f so a bad URL fails here instead of handing dpkg an HTML error page.
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Install dependencies
        # Node is only needed for the PDF build and the smoke test; Hugo renders
        # the site on its own.
        run: npm ci

      - name: Install Chromium for the PDF build
        # No --with-deps: ubuntu-latest already ships Playwright's system
        # libraries, and the apt step it adds is slow and can hang.
        # --yes stops npx prompting for confirmation on a non-interactive runner.
        run: npx --yes playwright install chromium

      - name: Validate drill data
        run: npm run check

      - name: Build site
        # The site is served from the root of cka.metacog.co.kr, so there is no
        # path prefix and one build serves both testing and deployment.
        run: npm run build

      - name: Regenerate the one-book PDF
        run: npm run build:pdf

      - name: Smoke-test the study tools
        # Drives review, practice, dashboard, plan and export/import in headless
        # Chromium and fails on any console error.
        run: npm run test:smoke

      # Requires Pages to be enabled with "GitHub Actions" as the source
      # (Settings -> Pages). The action's `enablement: true` option cannot do
      # that here: GITHUB_TOKEN gets "Resource not accessible by integration"
      # when it tries to create the Pages site.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # static/CNAME is copied here by Hugo, which is what points Pages at
          # the custom domain.
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
