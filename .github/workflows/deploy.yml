name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; drop the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung browser install should fail in minutes, not burn the default 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the PDF build
        # No --with-deps: ubuntu-latest already ships Playwright's system
        # libraries, and the apt step it adds is slow and can hang.
        # --yes stops npx prompting for confirmation on a non-interactive runner.
        run: npx --yes playwright install chromium

      - name: Validate drill data
        run: npm run check

      - name: Build site (root paths, for testing)
        run: npm run build

      - name: Smoke-test the study tools
        # Drives review, practice, dashboard, plan and export/import in headless
        # Chromium and fails on any console error. Runs against the root-path
        # build because the test server serves dist/ from /.
        run: npm run test:smoke

      - name: Rebuild for Pages
        # A project page is served from /<repo>/, so every URL needs that prefix.
        # Drop this env block if you move to a user page or a custom domain.
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Regenerate the one-book PDF
        run: npm run build:pdf

      # Requires Pages to be enabled with "GitHub Actions" as the source
      # (Settings -> Pages). The action's `enablement: true` option cannot do
      # that here: GITHUB_TOKEN gets "Resource not accessible by integration"
      # when it tries to create the Pages site.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
